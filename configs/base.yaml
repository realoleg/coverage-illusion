seed: 42

data:
  # Short dataset tag used in run folder paths.
  name: "dreaddit"
  dataset_name: "asmaab/dreaddit"
  output_dir: "data/processed"
  # Pool = HF train + HF validation, split by post_id, stratified by label:
  # StratifiedGroupKFold(n_splits, shuffle=True, random_state).
  # Fold k = the k-th test fold yielded by StratifiedGroupKFold(...).split().
  # Fold ranges are inclusive. The official HF test split is kept as the test set.
  split:
    n_splits: 20
    train_folds: [0, 11]
    validation_folds: [12, 14]
    calibration_folds: [15, 19]
    # Initial value; incremented (43, 44, ...) until the calibration minimums below hold.
    random_state: 42
    min_calibration_rows: 650
    min_calibration_rows_per_class: 300

baselines:
  max_features: 20000
  ngram_range: [1, 2]
  # TF-IDF + LogReg: C chosen by validation macro-F1 (ties -> smaller C). LinearSVC keeps its default C = 1.
  # Both are deterministic: one run each, folder seed_<seed> with the top-level seed.
  logreg_c_grid: [0.1, 0.3, 1, 3, 10]

paths:
  # One folder per run: <runs_dir>/<dataset>/<model>/seed_<seed>/
  runs_dir: "results/runs"
  # Temporary training checkpoints; each run deletes its own folder after predicting.
  checkpoints_dir: "results/checkpoints/tmp"

# Conditions predicted on calibration and test (validation is always clean only).
# Name = <family>_<percent>: head/tail keep that share of words, del deletes words with that probability,
# typo replaces letters with that probability. Random streams are seeded by hash(seed, id, family),
# so levels of one family are nested. Texts: <output_dir>/<data.name>_conditions.csv (scripts.make_conditions).
# This order is also the M3-mix draw order.
conditions: [
  "clean",
  "head_75", "head_50", "head_25",
  "tail_75", "tail_50", "tail_25",
  "del_15", "del_30",
  "typo_05", "typo_10",
]

encoders:
  models:
    distilbert: "distilbert-base-uncased"
    roberta: "roberta-base"
    mentalroberta: "mental/mental-roberta-base"
  seeds: [13, 42, 101, 2024, 7777]
  # Shared by all encoders, no per-model tuning. Best epoch by validation macro-F1.
  max_length: 512
  batch_size: 16
  gradient_accumulation_steps: 1
  # Release the MPS allocator cache every N training steps: with dynamic padding the cache of freed blocks
  # grows to the MPS limit (live tensors stay < 1 GB) and caused the earlier out-of-memory errors.
  # Memory management only; training is unchanged. Prediction passes also release the cache after each pass.
  # If a model still hits a genuine OOM, it switches to batch_size 8 x gradient_accumulation_steps 2
  # for all its seeds (author's rule; recorded in run_meta.json).
  torch_empty_cache_steps: 10
  learning_rate: 2.0e-5
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  # Sentence occlusion on the clean test split (Dreaddit only).
  occlusion_models: ["distilbert", "roberta"]

conformal:
  method: "lac"
  alpha_values: [0.1, 0.05]

  